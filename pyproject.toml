[project]
name = "pre-sales-knowledge-agent"
version = "0.0.0"
description = "Evaluable RAG and agent assistant for pre-sales knowledge and solution workflows"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pymupdf>=1.25,<2",
    "python-docx>=1.1,<2",
    "qdrant-client>=1.14,<2",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=5.7,<6",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
